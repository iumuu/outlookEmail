name: Publish AI Translation to Docker Hub

on:
  push:
    branches:
      - feature/ai-email-translation
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/dockerhub-ai-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/outlookemail
          tags: |
            type=raw,value=ai-translation
            type=sha,prefix=sha-
      - name: Build and publish
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
